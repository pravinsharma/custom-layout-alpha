<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>06-align-content</title>
<style>
  body { margin: 20px; font-family: sans-serif; background: #f0f0f0; }
  .container {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-content: center;
    gap: 8px;
    width: 400px;
    height: 300px;
    background: #ddd;
  }
  .item {
    background: #d94a8c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    flex: 0 0 120px;
    height: 50px;
  }
</style>
</head>
<body>
<h2>06-align-content</h2>
<p>Six items (two wrapped rows) with <code>align-content: center</code> distributes free space between row lines along the cross axis.</p>
<div class="container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
  <div class="item">5</div>
  <div class="item">6</div>
</div>
</body>
</html>
