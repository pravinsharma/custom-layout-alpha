<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>03-flex-wrap</title>
<style>
  body { margin: 20px; font-family: sans-serif; background: #f0f0f0; }
  .container {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 10px;
    align-content: flex-start;
    width: 500px;
    height: 300px;
    background: #ddd;
  }
  .item {
    background: #4ad9a0;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    flex: 0 0 120px;
    height: 60px;
  }
</style>
</head>
<body>
<h2>03-flex-wrap</h2>
<p>Five items with <code>flex-wrap: wrap</code> and <code>flex-basis: 120px</code>. Items wrap to a second row when they exceed the container width.</p>
<div class="container">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
  <div class="item">4</div>
  <div class="item">5</div>
</div>
</body>
</html>
