<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01-basic-row</title>
<style>
  body { margin: 20px; font-family: sans-serif; background: #f0f0f0; }
  .container {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    width: 800px;
    height: 300px;
    background: #ddd;
  }
  .item {
    background: #4a90d9;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
  }
  .item-1 { flex: 0 0 200px; }
  .item-2 { flex: 0 0 200px; }
  .item-3 { flex: 0 0 200px; }
</style>
</head>
<body>
<h2>01-basic-row</h2>
<p>Three fixed-width items in a flex row with <code>align-items: stretch</code>.</p>
<div class="container">
  <div class="item item-1">200px</div>
  <div class="item item-2">200px</div>
  <div class="item item-3">200px</div>
</div>
</body>
</html>
